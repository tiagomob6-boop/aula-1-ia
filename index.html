<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jogo de Pac-Man desenvolvido em JavaScript e Canvas.">
    <title>Pac-Man | Jogo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contêiner principal: reúne o painel de informações, o tabuleiro e os controles. -->
    <main class="container">
        <!-- Cabeçalho fixo com o título e os indicadores atualizados pelo game.js. -->
        <header class="header">
            <h1>🎮 PAC-MAN</h1>

            <!-- Cada valor recebe um ID para que a pontuação seja atualizada em tempo real. -->
            <section class="info" aria-label="Informações da partida">
                <div class="score">Pontuação: <span id="score">0</span></div>
                <div class="high-score">Recorde: <span id="highScore">0</span></div>
                <div class="lives">Vidas: <span id="lives">3</span></div>
                <div class="level">Nível: <span id="level">1</span></div>
            </section>
        </header>

        <!-- O game.js desenha o labirinto, Pac-Man, os fantasmas e os itens neste canvas. -->
        <canvas id="gameCanvas" aria-label="Tabuleiro do jogo Pac-Man">
            Seu navegador não suporta o elemento canvas.
        </canvas>

        <!-- Painel de instruções e ações da partida. -->
        <section class="controls" aria-label="Controles do jogo">
            <p>Use as <strong>SETAS</strong> para mover Pac-Man</p>
            <p>Colete as bolinhas amarelas e evite os fantasmas!</p>
            <p>🍎 <strong>Frutas de Poder</strong> deixam você invencível por um tempo!</p>
            <div class="touch-controls" aria-label="Controles de toque">
                <button class="direction-button up" type="button" data-direction="1" aria-label="Mover para cima">&#9650;</button>
                <button class="direction-button" type="button" data-direction="3" aria-label="Mover para a esquerda">&#9664;</button>
                <button class="direction-button" type="button" data-direction="2" aria-label="Mover para baixo">&#9660;</button>
                <button class="direction-button" type="button" data-direction="4" aria-label="Mover para a direita">&#9654;</button>
            </div>
            <!-- Esses IDs são usados pelo game.js para iniciar e pausar o loop do jogo. -->
            <button id="startBtn" type="button">Iniciar Jogo</button>
            <button id="pauseBtn" type="button">Pausar</button>
        </section>

        <!-- Mensagens de início, pausa, colisão e fim de jogo aparecem neste elemento. -->
        <aside class="status" id="status" role="status" aria-live="polite">
            Clique em "Iniciar Jogo" para começar!
        </aside>
    </main>

    <script src="game.js"></script>
</body>
</html>
